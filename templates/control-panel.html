<div class="teatro-control-panel">
    {{#if isGM}}
    <div class="teatro-settings-header" style="padding: 10px; border-bottom: 1px solid var(--color-border-dark-1); margin-bottom: 10px; display: flex; flex-direction: column; gap: 5px;">
        <label for="teatro-scale-slider" style="font-size: 12px; font-weight: bold; color: var(--color-text-light-highlight);">
            <i class="fas fa-search-plus"></i> Altura do Personagem: <span id="teatro-scale-val">{{currentScale}}%</span> da tela
        </label>
        <input type="range" id="teatro-scale-slider" min="20" max="100" value="{{currentScale}}" style="width: 100%;">
    </div>
    {{/if}}
    <div class="teatro-panel-content">
        <div class="teatro-search-bar" style="padding: 0 10px 10px 10px; margin-top: 10px;">
            <input type="text" id="teatro-search-input" placeholder="Pesquisar ator ou pasta..." style="width: 100%; box-sizing: border-box; background: rgba(0, 0, 0, 0.5); color: white; border: 1px solid var(--color-border-dark-2); border-radius: 3px; padding: 5px;">
        </div>
        {{{folderHTML}}}

        {{#if unassigned.length}}
        <div class="teatro-folder" data-folder-id="root">
            <h3 class="teatro-folder-header">
                <i class="fas fa-folder-open"></i> Sem Pasta
                <span class="teatro-folder-count">({{unassigned.length}})</span>
            </h3>
            <div class="teatro-folder-content">
                {{#each unassigned as |actor|}}
                <div class="teatro-actor-item {{#if actor.active}}active{{/if}}" data-actor-id="{{actor.id}}">
                    <img class="teatro-actor-img" src="{{actor.img}}" alt="{{actor.name}}" title="{{actor.name}}" />
                    <span class="teatro-actor-name">{{actor.name}}</span>
                </div>
                {{/each}}
            </div>
        </div>
        {{/if}}
        
        {{#if hasNoActors}}
        <p class="teatro-no-actors">Nenhum ator encontrado.</p>
        {{/if}}
    </div>
</div>
