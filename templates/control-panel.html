<div class="teatro-control-panel">
    <div class="teatro-header-sticky">
        {{#if isGM}}
        <div class="teatro-settings-header">
            <div class="teatro-scale-row">
                <label for="teatro-scale-slider" title="Duplo clique aqui para restaurar 48%">
                    <i class="fas fa-arrows-alt-v"></i> Escala: <strong id="teatro-scale-val">{{currentScale}}%</strong>
                </label>
                <input type="range" id="teatro-scale-slider" min="20" max="100" value="{{currentScale}}">
            </div>

            <div class="teatro-gm-toggles">
                <button type="button" id="teatro-blur-btn" class="teatro-btn teatro-btn-blur {{#if blurEnabled}}active{{/if}}" title="Ativar/Desativar desfoque (~{{blurIntensity}}%) no fundo da cena para todos">
                    <i class="fas fa-eye"></i> <span class="teatro-blur-label">{{#if blurEnabled}}Blur: ON{{else}}Blur: OFF{{/if}}</span>
                </button>
                <button type="button" id="teatro-player-spotlight-btn" class="teatro-btn teatro-btn-perm {{#if allowPlayerSpotlight}}unlocked{{else}}locked{{/if}}" title="{{#if allowPlayerSpotlight}}Jogadores podem destacar o próprio personagem ao falar (clique para restringir só ao Mestre){{else}}Apenas o Mestre pode ativar o destaque de fala (clique para liberar aos jogadores){{/if}}">
                    <i class="fas {{#if allowPlayerSpotlight}}fa-unlock{{else}}fa-lock{{/if}}"></i>
                    <span class="teatro-perm-label">{{#if allowPlayerSpotlight}}Destaque: Livre{{else}}Destaque: Só GM{{/if}}</span>
                </button>
            </div>

            <div class="teatro-gm-actions">
                <button type="button" id="teatro-center-all-btn" class="teatro-btn teatro-btn-center" title="Reorganizar e centralizar todos os personagens ativos na tela">
                    <i class="fas fa-compress-arrows-alt"></i> Centralizar
                </button>
                <button type="button" id="teatro-force-sync-btn" class="teatro-btn teatro-btn-sync" title="Atualizar mídias e forçar sincronização para todos os jogadores">
                    <i class="fas fa-sync-alt"></i> Sinc.
                </button>
                <button type="button" id="teatro-remove-all-btn" class="teatro-btn teatro-btn-danger" title="Remover todos os personagens da cena">
                    <i class="fas fa-trash-alt"></i> Limpar
                </button>
            </div>

            <div class="teatro-stage-bar">
                <div class="teatro-stage-bar-header">
                    <span><i class="fas fa-star"></i> Em Cena: <strong id="teatro-active-count">{{activeCount}}</strong>/{{maxActors}}</span>
                    <button type="button" id="teatro-clear-spotlight-btn" class="teatro-mini-link" style="display: none;" title="Desativar destaque de fala de todos">
                        <i class="fas fa-lightbulb"></i> Resetar Foco
                    </button>
                </div>
                <div id="teatro-active-strip" class="teatro-active-strip"></div>
            </div>
        </div>
        {{/if}}

        <div class="teatro-toolbar">
            <div class="teatro-search-wrapper">
                <i class="fas fa-search teatro-search-icon"></i>
                <input type="text" id="teatro-search-input" value="{{searchQuery}}" placeholder="Pesquisar ator ou pasta...">
                <button type="button" id="teatro-search-clear" class="teatro-search-clear" title="Limpar pesquisa" style="{{#unless searchQuery}}display: none;{{/unless}}">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <button type="button" id="teatro-expand-all-btn" class="teatro-icon-btn" title="Expandir todas as pastas">
                <i class="fas fa-angle-double-down"></i>
            </button>
            <button type="button" id="teatro-collapse-all-btn" class="teatro-icon-btn" title="Recolher todas as pastas">
                <i class="fas fa-angle-double-up"></i>
            </button>
        </div>
    </div>

    <div class="teatro-panel-content">
        {{{folderHTML}}}
        {{{unassignedHTML}}}

        {{#if hasNoActors}}
        <p class="teatro-no-actors">Nenhum ator compatível encontrado.</p>
        {{/if}}
    </div>

    <div class="teatro-panel-footer" title="Arrastar: Mover | Dir: Espelhar | 2x Clique: Destacar | Shift+Clique: Pular | Alt+Clique: Impacto | Ctrl+Clique: Tremilique">
        <i class="fas fa-hand-pointer"></i> 2x Clique: Foco · Shift: Pular · Alt: Impacto · Ctrl: Tremilique
    </div>
</div>
